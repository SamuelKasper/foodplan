<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name=description content="Snk Foodplan">
    <title>Foodplan</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <section class="foodplanner__top">
            <h2 class="foodplanner__filter-headline">Merkliste 
                <span id="shared-wishlist-status" class="weekplan__shared-status" hidden></span>
            </h2>

            <form action="" class="foodplanner__form">
                <fieldset class="foodplanner__fieldset foodplanner__fieldset--select foodplanner__filter-wrapper">
                    <a href="index.html" type="button" class="button button--gray">Zur Übersicht</a>

                    <button type="button" class="button button--gray" onclick="shareWishlist()">Teilen</button>
                    <button type="button" class="button button--gray" onclick="openWishlist()">Öffnen</button>
                    <button type="button" class="button button--gray" onclick="resetWeekplan()">
                        <div class="">Liste leeren</div>
                    </button>
                </fieldset>
            </form>
        </section>

        <section class="foodplanner__results">
            <h2 class="foodplanner__results-headline">Hinzugefügt (<span class="foodplanner__results-count">0</span>)</h2>
            <ul id="weekplan__list" class="foodplanner__list"></ul>
        </section>

        <dialog class="foodplanner__sharelist-popup" id="foodplanner__sharelist-popup">
            <button class="foodplanner__sharelist-popup-close" id="foodplanner__sharelist-popup-close">
                <svg class="sharelist__popup-close-icon" viewBox="0 0 640 640"><path d="M183.1 137.4C170.6 124.9 150.3 124.9 137.8 137.4C125.3 149.9 125.3 170.2 137.8 182.7L275.2 320L137.9 457.4C125.4 469.9 125.4 490.2 137.9 502.7C150.4 515.2 170.7 515.2 183.2 502.7L320.5 365.3L457.9 502.6C470.4 515.1 490.7 515.1 503.2 502.6C515.7 490.1 515.7 469.8 503.2 457.3L365.8 320L503.1 182.6C515.6 170.1 515.6 149.8 503.1 137.3C490.6 124.8 470.3 124.8 457.8 137.3L320.5 274.7L183.1 137.4z"/></svg>
            </button>
            <h3 class="foodplanner__sharelist-popup-headline" id="foodplanner__sharelist-popup-headline">
                Merkliste geteilt
            </h3>
            <button id="foodplanner__sharelist-popup-copy" class="foodplanner__sharelist-popup-copy">
                <svg class="sharelist-popup-copy-icon" viewBox="0 0 640 640"><path d="M288 64C252.7 64 224 92.7 224 128L224 384C224 419.3 252.7 448 288 448L480 448C515.3 448 544 419.3 544 384L544 183.4C544 166 536.9 149.3 524.3 137.2L466.6 81.8C454.7 70.4 438.8 64 422.3 64L288 64zM160 192C124.7 192 96 220.7 96 256L96 512C96 547.3 124.7 576 160 576L352 576C387.3 576 416 547.3 416 512L416 496L352 496L352 512L160 512L160 256L176 256L176 192L160 192z"/></svg>
                <p class="foodplanner__sharelist-popup-code" id="foodplanner__sharelist-popup-code"></p>
            </button>
        </dialog>
    </div>

    <div id="notification" style="display: none;">Text wurde kopiert!</div>
    <script type="text/javascript" src="js/recipe-card.js"></script>
    <script type="text/javascript" src="js/weekplan.js"></script>
    <script type="text/javascript" src="js/color-theme.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }
    </script>
</body>
</html>
